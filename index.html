<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#000000" />
  <title>سوق الذهبي & Mohsen AI</title>
  <style>
    * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; }
    html, body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #ffffff;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .top-bar {
      display: flex;
      background-color: #000000;
      border-bottom: 1px solid #262626;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .tab-btn {
      flex: 1;
      padding: 15px;
      background: transparent;
      color: #a0a0a0;
      border: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      border-bottom: 3px solid transparent;
    }
    .tab-btn.active {
      color: #00e676;
      border-bottom-color: #00e676;
      background-color: #181818;
    }
    .container {
      padding: 14px;
      max-width: 720px;
      margin: auto;
    }
    .page { display: none; }
    .page.active { display: block; }
    .notif-banner {
      display: none;
      background-color: #102a21;
      border: 1px solid #00e676;
      color: #d8ffeb;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 13px;
      line-height: 1.6;
    }
    .notif-banner.show { display: block; }
    .card {
      background-color: #1c1c1c;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .karat { font-size: 17px; font-weight: bold; color: #ffd54f; }
    .prices { text-align: left; font-size: 14px; line-height: 1.7; direction: ltr; }
    .up { color: #00e676; font-weight: bold; }
    .down { color: #ff5252; font-weight: bold; }

    /* مساحة الشات مفتوحة بالكامل بدون صندوق محبوس */
    #page-ai.active {
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 78px);
    }
    .chat-stream {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding-bottom: 84px;
    }
    .msg {
      padding: 11px 14px;
      border-radius: 12px;
      margin-bottom: 10px;
      max-width: 88%;
      line-height: 1.7;
      font-size: 14px;
      word-wrap: break-word;
    }
    .bot-msg {
      background-color: #202020;
      border-right: 3px solid #00e676;
      align-self: flex-start;
    }
    .user-msg {
      background-color: #0d3b2e;
      align-self: flex-end;
      text-align: right;
    }
    .input-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: #121212;
      border-top: 1px solid #262626;
      padding: 10px 14px;
      z-index: 20;
    }
    .input-row {
      display: flex;
      gap: 8px;
      max-width: 720px;
      margin: auto;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #333;
      background-color: #1c1c1c;
      color: #fff;
      font-size: 14px;
    }
    .send-btn {
      padding: 12px 18px;
      border-radius: 10px;
      border: none;
      background-color: #00e676;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }
    .note { font-size: 12px; color: #9e9e9e; margin-bottom: 12px; }
  </style>
</head>
<body>

  <div class="top-bar">
    <button id="tab-gold" class="tab-btn active" onclick="switchTab('gold')">سوق الذهبي</button>
    <button id="tab-ai" class="tab-btn" onclick="switchTab('ai')">Mohsen AI</button>
  </div>

  <div class="container">
    <!-- صفحة سوق الذهبي -->
    <div id="page-gold" class="page active">
      <div id="gold-notif" class="notif-banner"></div>
      <div id="gold-note" class="note">Auto-checking every 30s...</div>
      <div class="card">
        <div class="karat">عيار 24</div>
        <div class="prices">Buy: <span id="k24-buy" class="up">---</span><br>Sell: <span id="k24-sell">---</span></div>
      </div>
      <div class="card">
        <div class="karat">عيار 21</div>
        <div class="prices">Buy: <span id="k21-buy" class="up">---</span><br>Sell: <span id="k21-sell">---</span></div>
      </div>
      <div class="card">
        <div class="karat">عيار 18</div>
        <div class="prices">Buy: <span id="k18-buy" class="up">---</span><br>Sell: <span id="k18-sell">---</span></div>
      </div>
      <div class="card">
        <div class="karat">الجنيه الذهب</div>
        <div class="prices">Buy: <span id="pound-buy" class="up">---</span><br>Sell: <span id="pound-sell">---</span></div>
      </div>
    </div>

    <!-- صفحة Mohsen AI -->
    <div id="page-ai" class="page">
      <div id="chat-stream" class="chat-stream">
        <div id="welcome-msg" class="msg bot-msg">أهلاً بيك في Mohsen AI. اسألني في أي حاجة أو قولي اسمك وصححلي لو حابب.</div>
      </div>
      <div class="input-bar">
        <div class="input-row">
          <input id="user-input" type="text" placeholder="اكتب رسالتك هنا..." onkeydown="if(event.key==='Enter') sendMessage()" />
          <button class="send-btn" onclick="sendMessage()">إرسال</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const VERIFIED_GOLD_DATA = {
      sourceLabel: 'Market Feed (30s Auto-Check)',
      k24: { buy: 6525.75, sell: 6582.75 },
      k21: { buy: 5710, sell: 5760 },
      k18: { buy: 4894.25, sell: 4937.25 },
      pound: { buy: 45680, sell: 46080 }
    };

    const CUSTOM_API_URL = '';
    const PRICE_STORAGE_KEY = 'gold_last_snapshot_v3';
    const MEMORY_STORAGE_KEY = 'mohsen_ai_memory_v1';

    const STOP_WORDS = new Set([
      'في', 'من', 'على', 'الى', 'إلى', 'عن', 'مع', 'ده', 'دي', 'دا', 'هو', 'هي',
      'انا', 'أنا', 'انت', 'إنت', 'ليه', 'ايه', 'إيه', 'ازاي', 'إزاي', 'هل', 'ما',
      'مش', 'لو', 'كان', 'يكون', 'كده', 'كذا', 'بس', 'يعني', 'اللي', 'و', 'او', 'أو'
    ]);

    const KNOWN_VOCABULARY = [
      'عيار', 'جنيه', 'ذهب', 'دهب', 'سعر', 'اسعار', 'بكام', 'شراء', 'بيع',
      'اهلا', 'مرحبا', 'سلام', 'ازيك', 'اخبارك', 'منور', 'شكرا', 'تسلم',
      'اسمي', 'انسى', 'امسح', 'معقول', 'بجد', 'ازاي', 'ليه', 'تضخم', 'فايده', 'مصنعيه',
      'عامل', 'معلومه', 'توقعات', 'ادخار', 'استثمار', 'مقارنه', 'تحديث', 'اشعار'
    ];

    const GREETING_WORDS = new Set([
      'اهلا', 'مرحبا', 'سلام', 'هاي', 'هلا', 'ازيك', 'اخبارك', 'منور', 'صباح', 'مساء', 'عامل'
    ]);

    let currentGoldData = cloneGoldData(VERIFIED_GOLD_DATA);
    let hasInitialBaseline = false;
    let conversationHistory = [];
    let lastReasoningMeta = null;
    let repeatCounters = {};
    let memoryStore = loadMemoryStore();

    function cloneGoldData(data) {
      return {
        sourceLabel: data.sourceLabel || 'Market Feed',
        k24: { buy: Number(data.k24.buy), sell: Number(data.k24.sell) },
        k21: { buy: Number(data.k21.buy), sell: Number(data.k21.sell) },
        k18: { buy: Number(data.k18.buy), sell: Number(data.k18.sell) },
        pound: { buy: Number(data.pound.buy), sell: Number(data.pound.sell) }
      };
    }

    function loadMemoryStore() {
      try {
        const raw = localStorage.getItem(MEMORY_STORAGE_KEY);
        if (!raw) return { pairs: [], userProfile: { name: '' } };
        const parsed = JSON.parse(raw);
        return {
          pairs: Array.isArray(parsed.pairs) ? parsed.pairs : [],
          userProfile: parsed.userProfile && typeof parsed.userProfile === 'object'
            ? { name: typeof parsed.userProfile.name === 'string' ? parsed.userProfile.name : '' }
            : { name: '' }
        };
      } catch (e) {
        return { pairs: [], userProfile: { name: '' } };
      }
    }

    function saveMemoryStore() {
      try {
        localStorage.setItem(MEMORY_STORAGE_KEY, JSON.stringify(memoryStore));
      } catch (e) {}
    }

    function applySavedWelcomeName() {
      const welcomeEl = document.getElementById('welcome-msg');
      if (welcomeEl && memoryStore.userProfile && memoryStore.userProfile.name) {
        welcomeEl.innerHTML = `أهلاً بيك يا <b>${escapeHtml(memoryStore.userProfile.name)}</b> في Mohsen AI. اسألني في أي حاجة أو قولي لو حابب أتعلم معلومة.`;
      }
    }

    function readSavedGoldData() {
      try {
        const raw = localStorage.getItem(PRICE_STORAGE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (isValidGoldData(parsed)) return cloneGoldData(parsed);
      } catch (e) {}
      return null;
    }

    function saveGoldData(data) {
      try {
        localStorage.setItem(PRICE_STORAGE_KEY, JSON.stringify(data));
      } catch (e) {}
    }

    function isValidGoldData(data) {
      const keys = ['k24', 'k21', 'k18', 'pound'];
      if (!data || typeof data !== 'object') return false;
      return keys.every((k) => {
        const item = data[k];
        return (
          item &&
          typeof item.buy === 'number' &&
          Number.isFinite(item.buy) &&
          item.buy > 0 &&
          typeof item.sell === 'number' &&
          Number.isFinite(item.sell) &&
          item.sell > 0
        );
      });
    }

    function detectPriceChanges(oldData, newData) {
      const labels = {
        k24: '24K',
        k21: '21K',
        k18: '18K',
        pound: 'Gold Pound'
      };
      const changes = [];
      ['k24', 'k21', 'k18', 'pound'].forEach((key) => {
        if (oldData[key].buy !== newData[key].buy) {
          changes.push(`${labels[key]} Buy: ${formatEGP(oldData[key].buy)} -> ${formatEGP(newData[key].buy)}`);
        }
        if (oldData[key].sell !== newData[key].sell) {
          changes.push(`${labels[key]} Sell: ${formatEGP(oldData[key].sell)} -> ${formatEGP(newData[key].sell)}`);
        }
      });
      return changes;
    }

    async function triggerPriceNotification(changesText) {
      const banner = document.getElementById('gold-notif');
      if (banner) {
        banner.innerHTML = `<b>تم رصد تغير في الأسعار:</b><br>${changesText}`;
        banner.classList.add('show');
      }

      if ('Notification' in window) {
        try {
          if (Notification.permission === 'default') {
            await Notification.requestPermission();
          }
          if (Notification.permission === 'granted') {
            new Notification('سوق الذهبي — تحديث أسعار', {
              body: changesText.replace(/<br>/g, ' | ')
            });
          }
        } catch (e) {}
      }
    }

    function switchTab(tab) {
      document.getElementById('page-gold').classList.toggle('active', tab === 'gold');
      document.getElementById('page-ai').classList.toggle('active', tab === 'ai');
      document.getElementById('tab-gold').classList.toggle('active', tab === 'gold');
      document.getElementById('tab-ai').classList.toggle('active', tab === 'ai');
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    function formatEGP(num) {
      return Number(num).toLocaleString('en-US', {
        minimumFractionDigits: Number(num) % 1 === 0 ? 0 : 2,
        maximumFractionDigits: 2
      }) + ' EGP';
    }

    function applyDirectionClass(elId, oldVal, newVal, defaultClass) {
      const el = document.getElementById(elId);
      if (!el) return;
      el.classList.remove('up', 'down');
      if (newVal > oldVal) {
        el.classList.add('up');
      } else if (newVal < oldVal) {
        el.classList.add('down');
      } else if (defaultClass) {
        el.classList.add(defaultClass);
      }
    }

    async function loadGoldPrices() {
      const noteEl = document.getElementById('gold-note');
      const previousSnapshot = cloneGoldData(currentGoldData);
      let nextData = cloneGoldData(VERIFIED_GOLD_DATA);

      if (CUSTOM_API_URL) {
        try {
          const res = await fetch(CUSTOM_API_URL, { cache: 'no-store' });
          if (!res.ok) throw new Error('API response error');
          const apiData = await res.json();
          if (isValidGoldData(apiData)) {
            nextData = {
              sourceLabel: apiData.sourceLabel || 'Live API Feed',
              k24: { buy: Number(apiData.k24.buy), sell: Number(apiData.k24.sell) },
              k21: { buy: Number(apiData.k21.buy), sell: Number(apiData.k21.sell) },
              k18: { buy: Number(apiData.k18.buy), sell: Number(apiData.k18.sell) },
              pound: { buy: Number(apiData.pound.buy), sell: Number(apiData.pound.sell) }
            };
          }
        } catch (err) {
          nextData = cloneGoldData(VERIFIED_GOLD_DATA);
        }
      }

      if (hasInitialBaseline) {
        const changes = detectPriceChanges(previousSnapshot, nextData);
        if (changes.length > 0) {
          await triggerPriceNotification(changes.join('<br>'));
        }
      } else {
        const saved = readSavedGoldData();
        if (saved && JSON.stringify(saved) !== JSON.stringify(nextData)) {
          const changesFromSaved = detectPriceChanges(saved, nextData);
          if (changesFromSaved.length > 0) {
            await triggerPriceNotification(changesFromSaved.join('<br>'));
          }
        }
        hasInitialBaseline = true;
      }

      currentGoldData = cloneGoldData(nextData);
      saveGoldData(currentGoldData);

      document.getElementById('k24-buy').textContent = formatEGP(currentGoldData.k24.buy);
      document.getElementById('k24-sell').textContent = formatEGP(currentGoldData.k24.sell);

      document.getElementById('k21-buy').textContent = formatEGP(currentGoldData.k21.buy);
      document.getElementById('k21-sell').textContent = formatEGP(currentGoldData.k21.sell);

      document.getElementById('k18-buy').textContent = formatEGP(currentGoldData.k18.buy);
      document.getElementById('k18-sell').textContent = formatEGP(currentGoldData.k18.sell);

      document.getElementById('pound-buy').textContent = formatEGP(currentGoldData.pound.buy);
      document.getElementById('pound-sell').textContent = formatEGP(currentGoldData.pound.sell);

      applyDirectionClass('k24-buy', previousSnapshot.k24.buy, currentGoldData.k24.buy, 'up');
      applyDirectionClass('k21-buy', previousSnapshot.k21.buy, currentGoldData.k21.buy, 'up');
      applyDirectionClass('k18-buy', previousSnapshot.k18.buy, currentGoldData.k18.buy, 'up');
      applyDirectionClass('pound-buy', previousSnapshot.pound.buy, currentGoldData.pound.buy, 'up');

      if (noteEl) {
        const checkedAt = new Date().toLocaleTimeString('en-US', { hour12: true });
        noteEl.textContent = `${currentGoldData.sourceLabel} | Checked every 30s | Last check: ${checkedAt}`;
      }
    }

    function normalizeArabic(str) {
      return str
        .toLowerCase()
        .replace(/[أإآ]/g, 'ا')
        .replace(/ة/g, 'ه')
        .replace(/ى/g, 'ي')
        .replace(/[ًٌٍَُِّ~ْ.,!?؟،؛:()\-_"'/\\]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function levenshteinDistance(a, b) {
      const m = a.length;
      const n = b.length;
      if (m === 0) return n;
      if (n === 0) return m;
      const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
      for (let i = 0; i <= m; i++) dp[i][0] = i;
      for (let j = 0; j <= n; j++) dp[0][j] = j;
      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;
          dp[i][j] = Math.min(
            dp[i - 1][j] + 1,
            dp[i][j - 1] + 1,
            dp[i - 1][j - 1] + cost
          );
        }
      }
      return dp[m][n];
    }

    function guessClosestWord(word, candidates) {
      if (!word || word.length < 2 || /^\d+$/.test(word)) return word;
      let bestWord = word;
      let bestDist = Infinity;

      for (const cand of candidates) {
        if (!cand || Math.abs(cand.length - word.length) > 2) continue;
        const dist = levenshteinDistance(word, cand);
        const maxAllowed = cand.length <= 3 ? 1 : (cand.length <= 5 ? 1 : 2);
        if (dist > 0 && dist <= maxAllowed && dist < bestDist) {
          bestDist = dist;
          bestWord = cand;
        }
      }
      return bestWord;
    }

    function buildDynamicCandidates() {
      const learnedWords = [];
      for (const pair of memoryStore.pairs || []) {
        const parts = normalizeArabic(pair.promptNorm || '').split(' ');
        for (const p of parts) {
          if (p.length >= 2 && !STOP_WORDS.has(p)) {
            learnedWords.push(p);
          }
        }
      }
      return Array.from(new Set([...KNOWN_VOCABULARY, ...learnedWords]));
    }

    function applyTypoCorrection(rawText) {
      const clean = normalizeArabic(rawText);
      const candidates = buildDynamicCandidates();
      const words = clean.split(' ');
      const correctedWords = words.map((w) => guessClosestWord(w, candidates));
      return correctedWords.join(' ').trim();
    }

    function extractKeywords(str) {
      return normalizeArabic(str)
        .split(' ')
        .filter((w) => w.length > 1 && !STOP_WORDS.has(w));
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function pickVariant(variants, key) {
      const idx = repeatCounters[key] || 0;
      repeatCounters[key] = idx + 1;
      return variants[idx % variants.length];
    }

    function handleUserNameCommands(rawText) {
      const trimmed = rawText.trim();
      const clean = normalizeArabic(trimmed);

      if (/^(انس[يى]\s+اسمي|امسح\s+اسمي|احذف\s+اسمي)$/.test(clean)) {
        memoryStore.userProfile.name = '';
        saveMemoryStore();
        return 'تم مسح اسمك المحفوظ.';
      }

      if (/^(اسمي\s*(ايه|إيه|ايش|شو)?|انا\s+مين|عارف\s+اسمي|تعرف\s+اسمي|فاكر\s+اسمي)\s*[؟?]*$/.test(clean)) {
        if (memoryStore.userProfile && memoryStore.userProfile.name) {
          return `اسمك ${escapeHtml(memoryStore.userProfile.name)}.`;
        }
        return 'لسه مقولتليش اسمك.';
      }

      const nameMatch = trimmed.match(/(?:^|\s)(?:اسمي(?:\s+(?:هو|هي|بقى|بقا))?|انا\s+اسمي|ناديني|قولي\s+يا)\s+([^\s،.!?؟]+(?:\s+[^\s،.!?؟]+){0,2})/i);
      if (nameMatch && nameMatch[1]) {
        const candidate = nameMatch[1]
          .replace(/\s+(ايه|إيه|ليه|عشان|يا|ده|دي)$/i, '')
          .trim();
        if (candidate && candidate.length >= 2 && candidate.length <= 40) {
          memoryStore.userProfile.name = candidate;
          saveMemoryStore();
          return `تمام، هفضل فاكرك باسم ${escapeHtml(candidate)}.`;
        }
      }

      return null;
    }

    function handleSurpriseOrIntelligenceComment(rawText) {
      const clean = normalizeArabic(rawText);
      const isSurprise = /^(معقول|بجد|والله|يا سلام|اوباه|واو|غريب|عجيب|مش ممكن|ازاي ده|ايوه بقي|جامد|حلو ده)\s*[؟!.]*$/.test(clean);
      const asksWhyOrHow = /^(ازاي\s+(عرفت|جبتها|فهمت|عملتها)|ليه\s+(قلت|رديت|اخترت)\s+كده|عندك\s+ذكاء|فاهم\s+انت)\s*[؟!.]*$/.test(clean);

      if (!isSurprise && !asksWhyOrHow) return null;

      if (!lastReasoningMeta) {
        return pickVariant([
          'أيوة، بحاول أربط الكلام باللي قدامي وباللي اتقال أو اتحفظ.',
          'بعتمد على الكلمات والبيانات المتاحة عندي؛ قولي في إيه بالظبط.'
        ], 'meta_none');
      }

      if (lastReasoningMeta.type === 'learned') {
        return pickVariant([
          'أيوة، ده من اللي اتسجّل واتحفظ عندي قبل كده.',
          'جبتها من الذاكرة المحفوظة عندي وطبّقتها على كلامك.'
        ], 'meta_learned');
      }

      if (lastReasoningMeta.type === 'price') {
        return pickVariant([
          'أيوة، دي الأسعار المتاحة حالياً في البرنامج بالـ EGP.',
          'خدت الأرقام الحالية من بيانات الأسعار وعرضتهالك بالـ EGP.'
        ], 'meta_price');
      }

      return pickVariant([
        'أيوة، بقرا كلامك وأرد عليه بشكل منطقي على قد المعطيات المتاحة.',
        'بحاول أدي رد مباشر ومناسب للكلام من غير لف.'
      ], 'meta_gen');
    }

    function learnAssociation(promptText, answerText, weightBoost = 1) {
      const cleanPrompt = normalizeArabic(promptText);
      const cleanAnswer = answerText.trim();
      const keywords = extractKeywords(promptText);
      if (!cleanPrompt || !cleanAnswer) return;

      const existing = memoryStore.pairs.find((p) => p.promptNorm === cleanPrompt);
      if (existing) {
        existing.answer = cleanAnswer;
        existing.keywords = Array.from(new Set([...existing.keywords, ...keywords]));
        existing.weight = (existing.weight || 1) + weightBoost;
      } else {
        memoryStore.pairs.push({
          promptRaw: promptText.trim(),
          promptNorm: cleanPrompt,
          keywords,
          answer: cleanAnswer,
          weight: weightBoost
        });
      }
      saveMemoryStore();
    }

    function isCorrectionOrClarification(rawText) {
      const clean = normalizeArabic(rawText);
      return /^(لا|مش كده|غلط|صحح|المقصود|قصدي|معناه|بمعنى|يعني ان|خلي بالك|توضيح)/.test(clean);
    }

    function findBestLearnedMatch(rawText) {
      const clean = normalizeArabic(rawText);
      const inputKeywords = extractKeywords(rawText);
      if (!memoryStore.pairs.length || (!clean && !inputKeywords.length)) return null;

      let best = null;
      let bestScore = 0;

      for (const pair of memoryStore.pairs) {
        let score = 0;
        if (clean === pair.promptNorm) {
          score += 10;
        } else if (clean.includes(pair.promptNorm) || pair.promptNorm.includes(clean)) {
          score += 5;
        }

        const pairKw = pair.keywords || [];
        if (pairKw.length && inputKeywords.length) {
          const matches = pairKw.filter((k) => inputKeywords.includes(k)).length;
          if (matches > 0) {
            score += (matches / Math.max(pairKw.length, inputKeywords.length)) * 4;
          }
        }

        score += (pair.weight || 1) * 0.25;

        if (score > bestScore) {
          bestScore = score;
          best = pair;
        }
      }

      return bestScore >= 2.2 ? best : null;
    }

    function synthesizeDirectAnswer(rawText) {
      const clean = normalizeArabic(rawText);
      const keywords = extractKeywords(rawText);
      const namePrefix = memoryStore.userProfile && memoryStore.userProfile.name
        ? `${escapeHtml(memoryStore.userProfile.name)}، `
        : '';

      const asksPriceValue = /عيار\s*(24|21|18)|24k|21k|18k|جنيه ذهب|الجنيه|سعر الذهب|اسعار الذهب|الذهب بكام|الدهب بكام|بكام/.test(clean);
      if (asksPriceValue) {
        lastReasoningMeta = { type: 'price' };
        if (/عيار 21|21k/.test(clean)) {
          return pickVariant([
            `${namePrefix}عيار 21: شراء ${formatEGP(currentGoldData.k21.buy)} | بيع ${formatEGP(currentGoldData.k21.sell)}`,
            `${namePrefix}سعر عيار 21 دلوقتي شراء ${formatEGP(currentGoldData.k21.buy)} والبيع ${formatEGP(currentGoldData.k21.sell)}.`
          ], 'price_21');
        }
        if (/عيار 24|24k/.test(clean)) {
          return pickVariant([
            `${namePrefix}عيار 24: شراء ${formatEGP(currentGoldData.k24.buy)} | بيع ${formatEGP(currentGoldData.k24.sell)}`,
            `${namePrefix}عيار 24 حالياً شراء ${formatEGP(currentGoldData.k24.buy)} والبيع ${formatEGP(currentGoldData.k24.sell)}.`
          ], 'price_24');
        }
        if (/عيار 18|18k/.test(clean)) {
          return pickVariant([
            `${namePrefix}عيار 18: شراء ${formatEGP(currentGoldData.k18.buy)} | بيع ${formatEGP(currentGoldData.k18.sell)}`,
            `${namePrefix}سعر عيار 18 دلوقتي شراء ${formatEGP(currentGoldData.k18.buy)} والبيع ${formatEGP(currentGoldData.k18.sell)}.`
          ], 'price_18');
        }
        if (/جنيه ذهب|الجنيه/.test(clean)) {
          return pickVariant([
            `${namePrefix}الجنيه الذهب: شراء ${formatEGP(currentGoldData.pound.buy)} | بيع ${formatEGP(currentGoldData.pound.sell)}`,
            `${namePrefix}سعر الجنيه الذهب حالياً شراء ${formatEGP(currentGoldData.pound.buy)} والبيع ${formatEGP(currentGoldData.pound.sell)}.`
          ], 'price_pound');
        }
        return pickVariant([
          `${namePrefix}عيار 24: شراء ${formatEGP(currentGoldData.k24.buy)} / بيع ${formatEGP(currentGoldData.k24.sell)}<br>` +
          `${namePrefix}عيار 21: شراء ${formatEGP(currentGoldData.k21.buy)} / بيع ${formatEGP(currentGoldData.k21.sell)}<br>` +
          `${namePrefix}عيار 18: شراء ${formatEGP(currentGoldData.k18.buy)} / بيع ${formatEGP(currentGoldData.k18.sell)}<br>` +
          `${namePrefix}الجنيه الذهب: شراء ${formatEGP(currentGoldData.pound.buy)} / بيع ${formatEGP(currentGoldData.pound.sell)}`,
          `${namePrefix}الأسعار الحالية: 24K شراء ${formatEGP(currentGoldData.k24.buy)} بيع ${formatEGP(currentGoldData.k24.sell)}، 21K شراء ${formatEGP(currentGoldData.k21.buy)} بيع ${formatEGP(currentGoldData.k21.sell)}، 18K شراء ${formatEGP(currentGoldData.k18.buy)} بيع ${formatEGP(currentGoldData.k18.sell)}، والجنيه الذهب شراء ${formatEGP(currentGoldData.pound.buy)} بيع ${formatEGP(currentGoldData.pound.sell)}.`
        ], 'price_all');
      }

      if (/تضخم/.test(clean)) {
        lastReasoningMeta = { type: 'general' };
        return pickVariant([
          `${namePrefix}التضخم يعني زيادة الأسعار وتراجع قيمة العملة مع الوقت، وده بيخلي ناس كتير تعتبر الذهب وسيلة لحفظ القيمة على المدى الطويل.`,
          `${namePrefix}لما التضخم بيزيد والعملة بتفقد جزء من قوتها الشرائية، الذهب بيُستخدم غالباً لحفظ القيمة أكتر من كونه دخل ثابت.`
        ], 'inflation');
      }

      if (/فايده|فائده|مركزي/.test(clean)) {
        lastReasoningMeta = { type: 'general' };
        return pickVariant([
          `${namePrefix}رفع الفائدة غالباً بيزود جاذبية الادخار البنكي ويضغط على الذهب أحياناً، والعكس لما الفائدة بتنخفض.`,
          `${namePrefix}الفائدة بتأثر على حركة السيولة والادخار؛ لما بترتفع بيقل أحياناً الإقبال اللحظي على الذهب مقارنة بالودائع.`
        ], 'interest');
      }

      if (/مصنعيه|سبايك|سبيكه/.test(clean)) {
        lastReasoningMeta = { type: 'general' };
        return pickVariant([
          `${namePrefix}السبائك والجنيهات مصنعيتها أقل من المشغولات الذهبية، وبيتم استرداد جزء من مصنعية السبائك أحياناً حسب الشروط.`,
          `${namePrefix}المشغولات بيكون فيها مصنعية أعلى مقابل الصياغة، بينما السبائك والجنيهات مصنعيتها أقل.`
        ], 'workmanship');
      }

      lastReasoningMeta = { type: 'general' };
      const topic = keywords.length > 0 ? keywords.join('، ') : clean;
      if (topic) {
        return pickVariant([
          `${namePrefix}في موضوع (${escapeHtml(topic)})، القرار أو الرأي الصح بيعتمد على وضعك وهدفك الحالي؛ تحب نركز على إيه بالظبط؟`,
          `${namePrefix}بخصوص (${escapeHtml(topic)})، قولي النقطة اللي تهمك أو الفكرة اللي شايفها عشان نكمل فيها.`
        ], `kw_${topic}`);
      }

      return pickVariant([
        `${namePrefix}قولي تحب نتكلم في إيه دلوقتي؟`,
        `${namePrefix}أنا معاك، اسأل أو قولي اللي في بالك.`
      ], `gen_${clean}`);
    }

    function generateSmartReply(rawText) {
      const trimmed = rawText.trim();
      const correctedText = applyTypoCorrection(trimmed);
      const clean = normalizeArabic(correctedText);

      const nameReply = handleUserNameCommands(trimmed) || handleUserNameCommands(correctedText);
      if (nameReply) {
        lastReasoningMeta = { type: 'learned' };
        return nameReply;
      }

      const metaReply = handleSurpriseOrIntelligenceComment(correctedText);
      if (metaReply) {
        return metaReply;
      }

      const lastUserMsg = [...conversationHistory].reverse().find((m) => m.role === 'user');
      if (isCorrectionOrClarification(correctedText) && lastUserMsg && lastUserMsg.text !== trimmed) {
        const cleanedClarification = trimmed.replace(/^(لا|مش كده|غلط|صحح|المقصود|قصدي|معناه|بمعنى|يعني)\s*/i, '').trim() || trimmed;
        learnAssociation(lastUserMsg.text, cleanedClarification, 2);
        lastReasoningMeta = { type: 'learned' };
        return 'تمام، هعتمد التوضيح ده بعد كده.';
      }

      const learnedMatch = findBestLearnedMatch(correctedText) || findBestLearnedMatch(trimmed);
      if (learnedMatch) {
        lastReasoningMeta = { type: 'learned' };
        return escapeHtml(learnedMatch.answer);
      }

      const wordsInClean = clean.split(' ').filter(Boolean);
      const isGreeting = /^(اهلا|مرحبا|سلام|السلام عليكم|صباح الخير|مساء الخير|هاي|hi|hello|hey|ازيك|ازيكم|عامل ايه|اخبارك|منور|منورين)$/.test(clean)
        || (wordsInClean.length === 1 && GREETING_WORDS.has(wordsInClean[0]));

      if (isGreeting) {
        lastReasoningMeta = { type: 'general' };
        const greetingName = memoryStore.userProfile && memoryStore.userProfile.name
          ? ` يا ${escapeHtml(memoryStore.userProfile.name)}`
          : '';
        return pickVariant([
          `أهلاً بيك${greetingName}. إزاي أقدر أساعدك؟`,
          `أهلاً${greetingName}، منور. تحب تسأل عن إيه؟`
        ], 'greeting');
      }

      return synthesizeDirectAnswer(correctedText);
    }

    function appendBotBubble(htmlContent) {
      const stream = document.getElementById('chat-stream');
      const div = document.createElement('div');
      div.className = 'msg bot-msg';
      div.innerHTML = htmlContent;
      stream.appendChild(div);
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    function sendMessage() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if (!text) return;

      const stream = document.getElementById('chat-stream');
      const userDiv = document.createElement('div');
      userDiv.className = 'msg user-msg';
      userDiv.textContent = text;
      stream.appendChild(userDiv);
      input.value = '';

      conversationHistory.push({ role: 'user', text });

      const reply = generateSmartReply(text);
      appendBotBubble(reply);
    }

    applySavedWelcomeName();
    loadGoldPrices();
    setInterval(loadGoldPrices, 30000);
  </script>
