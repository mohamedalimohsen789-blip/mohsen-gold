<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#000000" />
  <title>سوق الذهبي & Mohsen AI</title>
  <style>
    * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; }
    html, body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #ffffff;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .top-bar {
      display: flex;
      background-color: #000000;
      border-bottom: 1px solid #262626;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .tab-btn {
      flex: 1;
      padding: 15px;
      background: transparent;
      color: #a0a0a0;
      border: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      border-bottom: 3px solid transparent;
    }
    .tab-btn.active {
      color: #00e676;
      border-bottom-color: #00e676;
      background-color: #181818;
    }
    .container {
      padding: 14px;
      max-width: 720px;
      margin: auto;
    }
    .page { display: none; }
    .page.active { display: block; }
    .notif-banner {
      display: none;
      background-color: #102a21;
      border: 1px solid #00e676;
      color: #d8ffeb;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 13px;
      line-height: 1.6;
    }
    .notif-banner.show { display: block; }
    .card {
      background-color: #1c1c1c;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .karat { font-size: 17px; font-weight: bold; color: #ffd54f; }
    .prices { text-align: left; font-size: 14px; line-height: 1.7; direction: ltr; }
    .up { color: #00e676; font-weight: bold; }
    .down { color: #ff5252; font-weight: bold; }

    #page-ai.active {
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 78px);
    }
    .chat-stream {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding-bottom: 84px;
    }
    .msg {
      padding: 11px 14px;
      border-radius: 12px;
      margin-bottom: 10px;
      max-width: 88%;
      line-height: 1.7;
      font-size: 14px;
      word-wrap: break-word;
      white-space: pre-line;
    }
    .bot-msg {
      background-color: #202020;
      border-right: 3px solid #00e676;
      align-self: flex-start;
    }
    .user-msg {
      background-color: #0d3b2e;
      align-self: flex-end;
      text-align: right;
    }
    .input-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: #121212;
      border-top: 1px solid #262626;
      padding: 10px 14px;
      z-index: 20;
    }
    .input-row {
      display: flex;
      gap: 8px;
      max-width: 720px;
      margin: auto;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #333;
      background-color: #1c1c1c;
      color: #fff;
      font-size: 14px;
    }
    .send-btn {
      padding: 12px 18px;
      border-radius: 10px;
      border: none;
      background-color: #00e676;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }
    .note { font-size: 12px; color: #9e9e9e; margin-bottom: 12px; }
  </style>
</head>
<body>

  <div class="top-bar">
    <button id="tab-gold" class="tab-btn active" onclick="switchTab('gold')">سوق الذهبي</button>
    <button id="tab-ai" class="tab-btn" onclick="switchTab('ai')">Mohsen AI</button>
  </div>

  <div class="container">
    <!-- صفحة سوق الذهبي -->
    <div id="page-gold" class="page active">
      <div id="gold-notif" class="notif-banner"></div>
      <div id="gold-note" class="note">Auto-checking every 30s...</div>
      <div class="card">
        <div class="karat">عيار 24</div>
        <div class="prices">Buy: <span id="k24-buy" class="up">---</span><br>Sell: <span id="k24-sell">---</span></div>
      </div>
      <div class="card">
        <div class="karat">عيار 21</div>
        <div class="prices">Buy: <span id="k21-buy" class="up">---</span><br>Sell: <span id="k21-sell">---</span></div>
      </div>
      <div class="card">
        <div class="karat">عيار 18</div>
        <div class="prices">Buy: <span id="k18-buy" class="up">---</span><br>Sell: <span id="k18-sell">---</span></div>
      </div>
      <div class="card">
        <div class="karat">الجنيه الذهب</div>
        <div class="prices">Buy: <span id="pound-buy" class="up">---</span><br>Sell: <span id="pound-sell">---</span></div>
      </div>
    </div>

    <!-- صفحة Mohsen AI -->
    <div id="page-ai" class="page">
      <div id="chat-stream" class="chat-stream">
        <div id="welcome-msg" class="msg bot-msg">أهلاً بيك في Mohsen AI. اسألني في أي حاجة أو قولي اسمك.</div>
      </div>
      <div class="input-bar">
        <div class="input-row">
          <input id="user-input" type="text" placeholder="اكتب رسالتك هنا..." onkeydown="if(event.key==='Enter') sendMessage()" />
          <button class="send-btn" onclick="sendMessage()">إرسال</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const VERIFIED_GOLD_DATA = {
      sourceLabel: 'Market Feed (30s Auto-Check)',
      k24: { buy: 6525.75, sell: 6582.75 },
      k21: { buy: 5710, sell: 5760 },
      k18: { buy: 4894.25, sell: 4937.25 },
      pound: { buy: 45680, sell: 46080 }
    };

    // ضع مفتاح Gemini API هنا أو اتركه فارغاً لاستخدام الرد المحلي
    const GEMINI_API_KEY = '';
    const GEMINI_MODEL = 'gemini-2.5-flash';

    const CUSTOM_API_URL = '';
    const PRICE_STORAGE_KEY = 'gold_last_snapshot_v3';
    const MEMORY_STORAGE_KEY = 'mohsen_ai_memory_v3';

    let currentGoldData = cloneGoldData(VERIFIED_GOLD_DATA);
    let hasInitialBaseline = false;
    let conversationHistory = [];
    let isSending = false;
    let memoryStore = loadMemoryStore();

    function cloneGoldData(data) {
      return {
        sourceLabel: data.sourceLabel || 'Market Feed',
        k24: { buy: Number(data.k24.buy), sell: Number(data.k24.sell) },
        k21: { buy: Number(data.k21.buy), sell: Number(data.k21.sell) },
        k18: { buy: Number(data.k18.buy), sell: Number(data.k18.sell) },
        pound: { buy: Number(data.pound.buy), sell: Number(data.pound.sell) }
      };
    }

    function loadMemoryStore() {
      try {
        const raw = localStorage.getItem(MEMORY_STORAGE_KEY);
        if (!raw) return { userProfile: { name: '' } };
        const parsed = JSON.parse(raw);
        return {
          userProfile: parsed.userProfile && typeof parsed.userProfile === 'object'
            ? { name: typeof parsed.userProfile.name === 'string' ? parsed.userProfile.name : '' }
            : { name: '' }
        };
      } catch (e) {
        return { userProfile: { name: '' } };
      }
    }

    function saveMemoryStore() {
      try {
        localStorage.setItem(MEMORY_STORAGE_KEY, JSON.stringify(memoryStore));
      } catch (e) {}
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function applySavedWelcomeName() {
      const welcomeEl = document.getElementById('welcome-msg');
      if (welcomeEl && memoryStore.userProfile && memoryStore.userProfile.name) {
        welcomeEl.innerHTML = `أهلاً بيك يا <b>${escapeHtml(memoryStore.userProfile.name)}</b> في Mohsen AI. اسألني في أي حاجة.`;
      }
    }

    function readSavedGoldData() {
      try {
        const raw = localStorage.getItem(PRICE_STORAGE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (isValidGoldData(parsed)) return cloneGoldData(parsed);
      } catch (e) {}
      return null;
    }

    function saveGoldData(data) {
      try {
        localStorage.setItem(PRICE_STORAGE_KEY, JSON.stringify(data));
      } catch (e) {}
    }

    function isValidGoldData(data) {
      const keys = ['k24', 'k21', 'k18', 'pound'];
      if (!data || typeof data !== 'object') return false;
      return keys.every((k) => {
        const item = data[k];
        return (
          item &&
          typeof item.buy === 'number' &&
          Number.isFinite(item.buy) &&
          item.buy > 0 &&
          typeof item.sell === 'number' &&
          Number.isFinite(item.sell) &&
          item.sell > 0
        );
      });
    }

    function detectPriceChanges(oldData, newData) {
      const labels = { k24: '24K', k21: '21K', k18: '18K', pound: 'Gold Pound' };
      const changes = [];
      ['k24', 'k21', 'k18', 'pound'].forEach((key) => {
        if (oldData[key].buy !== newData[key].buy) {
          changes.push(`${labels[key]} Buy: ${formatEGP(oldData[key].buy)} -> ${formatEGP(newData[key].buy)}`);
        }
        if (oldData[key].sell !== newData[key].sell) {
          changes.push(`${labels[key]} Sell: ${formatEGP(oldData[key].sell)} -> ${formatEGP(newData[key].sell)}`);
        }
      });
      return changes;
    }

    async function triggerPriceNotification(changesText) {
      const banner = document.getElementById('gold-notif');
      if (banner) {
        banner.innerHTML = `<b>تم رصد تغير في الأسعار:</b><br>${changesText}`;
        banner.classList.add('show');
      }

      if ('Notification' in window) {
        try {
          if (Notification.permission === 'default') {
            await Notification.requestPermission();
          }
          if (Notification.permission === 'granted') {
            new Notification('سوق الذهبي — تحديث أسعار', {
              body: changesText.replace(/<br>/g, ' | ')
            });
          }
        } catch (e) {}
      }
    }

    function switchTab(tab) {
      document.getElementById('page-gold').classList.toggle('active', tab === 'gold');
      document.getElementById('page-ai').classList.toggle('active', tab === 'ai');
      document.getElementById('tab-gold').classList.toggle('active', tab === 'gold');
      document.getElementById('tab-ai').classList.toggle('active', tab === 'ai');
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    function formatEGP(num) {
      return Number(num).toLocaleString('en-US', {
        minimumFractionDigits: Number(num) % 1 === 0 ? 0 : 2,
        maximumFractionDigits: 2
      }) + ' EGP';
    }

    function applyDirectionClass(elId, oldVal, newVal, defaultClass) {
      const el = document.getElementById(elId);
      if (!el) return;
      el.classList.remove('up', 'down');
      if (newVal > oldVal) el.classList.add('up');
      else if (newVal < oldVal) el.classList.add('down');
      else if (defaultClass) el.classList.add(defaultClass);
    }

    async function loadGoldPrices() {
      const noteEl = document.getElementById('gold-note');
      const previousSnapshot = cloneGoldData(currentGoldData);
      let nextData = cloneGoldData(VERIFIED_GOLD_DATA);

      if (CUSTOM_API_URL) {
        try {
          const res = await fetch(CUSTOM_API_URL, { cache: 'no-store' });
          if (res.ok) {
            const apiData = await res.json();
            if (isValidGoldData(apiData)) {
              nextData = {
                sourceLabel: apiData.sourceLabel || 'Live API Feed',
                k24: { buy: Number(apiData.k24.buy), sell: Number(apiData.k24.sell) },
                k21: { buy: Number(apiData.k21.buy), sell: Number(apiData.k21.sell) },
                k18: { buy: Number(apiData.k18.buy), sell: Number(apiData.k18.sell) },
                pound: { buy: Number(apiData.pound.buy), sell: Number(apiData.pound.sell) }
              };
            }
          }
        } catch (err) {
          nextData = cloneGoldData(VERIFIED_GOLD_DATA);
        }
      }

      if (hasInitialBaseline) {
        const changes = detectPriceChanges(previousSnapshot, nextData);
        if (changes.length > 0) await triggerPriceNotification(changes.join('<br>'));
      } else {
        const saved = readSavedGoldData();
        if (saved && JSON.stringify(saved) !== JSON.stringify(nextData)) {
          const changesFromSaved = detectPriceChanges(saved, nextData);
          if (changesFromSaved.length > 0) await triggerPriceNotification(changesFromSaved.join('<br>'));
        }
        hasInitialBaseline = true;
      }

      currentGoldData = cloneGoldData(nextData);
      saveGoldData(currentGoldData);

      document.getElementById('k24-buy').textContent = formatEGP(currentGoldData.k24.buy);
      document.getElementById('k24-sell').textContent = formatEGP(currentGoldData.k24.sell);
      document.getElementById('k21-buy').textContent = formatEGP(currentGoldData.k21.buy);
      document.getElementById('k21-sell').textContent = formatEGP(currentGoldData.k21.sell);
      document.getElementById('k18-buy').textContent = formatEGP(currentGoldData.k18.buy);
      document.getElementById('k18-sell').textContent = formatEGP(currentGoldData.k18.sell);
      document.getElementById('pound-buy').textContent = formatEGP(currentGoldData.pound.buy);
      document.getElementById('pound-sell').textContent = formatEGP(currentGoldData.pound.sell);

      applyDirectionClass('k24-buy', previousSnapshot.k24.buy, currentGoldData.k24.buy, 'up');
      applyDirectionClass('k21-buy', previousSnapshot.k21.buy, currentGoldData.k21.buy, 'up');
      applyDirectionClass('k18-buy', previousSnapshot.k18.buy, currentGoldData.k18.buy, 'up');
      applyDirectionClass('pound-buy', previousSnapshot.pound.buy, currentGoldData.pound.buy, 'up');

      if (noteEl) {
        const checkedAt = new Date().toLocaleTimeString('en-US', { hour12: true });
        noteEl.textContent = `${currentGoldData.sourceLabel} | Checked every 30s | Last check: ${checkedAt}`;
      }
    }

    function handleUserNameCommands(rawText) {
      const trimmed = rawText.trim();
      const norm = trimmed.replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').toLowerCase();

      if (/^(انس[يى]\s+اسمي|امسح\s+اسمي|احذف\s+اسمي)$/.test(norm)) {
        memoryStore.userProfile.name = '';
        saveMemoryStore();
        return 'تم مسح اسمك المحفوظ.';
      }

      if (/^(اسمي\s*(ايه|إيه|ايش|شو)?|انا\s+مين|عارف\s+اسمي|تعرف\s+اسمي|فاكر\s+اسمي)\s*[؟?]*$/.test(norm)) {
        if (memoryStore.userProfile && memoryStore.userProfile.name) {
          return `اسمك ${escapeHtml(memoryStore.userProfile.name)}.`;
        }
        return 'لسه مقولتليش اسمك.';
      }

      const nameMatch = trimmed.match(/(?:^|\s)(?:اسمي(?:\s+(?:هو|هي|بقى|بقا))?|انا\s+اسمي|ناديني|قولي\s+يا)\s+([^\s،.!?؟]+(?:\s+[^\s،.!?؟]+){0,2})/i);
      if (nameMatch && nameMatch[1]) {
        const candidate = nameMatch[1].replace(/\s+(ايه|إيه|ليه|عشان|يا|ده|دي)$/i, '').trim();
        if (candidate && candidate.length >= 2 && candidate.length <= 40) {
          memoryStore.userProfile.name = candidate;
          saveMemoryStore();
          return `تمام، هفضل فاكرك باسم ${escapeHtml(candidate)}.`;
        }
      }

      return null;
    }

    async function askGeminiOpen(userText) {
      const savedName = memoryStore.userProfile && memoryStore.userProfile.name ? memoryStore.userProfile.name : '';
      const pricesSummary =
        `24K Buy ${formatEGP(currentGoldData.k24.buy)} / Sell ${formatEGP(currentGoldData.k24.sell)}, ` +
        `21K Buy ${formatEGP(currentGoldData.k21.buy)} / Sell ${formatEGP(currentGoldData.k21.sell)}, ` +
        `18K Buy ${formatEGP(currentGoldData.k18.buy)} / Sell ${formatEGP(currentGoldData.k18.sell)}, ` +
        `Gold Pound Buy ${formatEGP(currentGoldData.pound.buy)} / Sell ${formatEGP(currentGoldData.pound.sell)}.`;

      const systemInstruction =
        `أنت مساعد ذكي باسم Mohsen AI. أجب مباشرة ومختصراً وواضحاً باللغة العربية المصرية على أي سؤال مفتوح يطرحه المستخدم، دون مقدمات طويلة أو قوالب مثل "في موضوع...". ` +
        (savedName ? `اسم المستخدم المحفوظ هو "${savedName}". ` : '') +
        `الأسعار الحالية المسجلة في التطبيق بالـ EGP هي: ${pricesSummary}`;

      const contents = conversationHistory.slice(-8).map((item) => ({
        role: item.role === 'user' ? 'user' : 'model',
        parts: [{ text: item.text }]
      }));

      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(GEMINI_MODEL)}:generateContent?key=${encodeURIComponent(GEMINI_API_KEY)}`;

      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: systemInstruction }] },
          contents
        })
      });

      if (!res.ok) {
        throw new Error(`HTTP ${res.status}`);
      }

      const data = await res.json();
      const candidateText = data?.candidates?.[0]?.content?.parts
        ?.map((p) => p.text || '')
        .join('')
        .trim();

      if (!candidateText) {
        throw new Error('Empty response');
      }

      return escapeHtml(candidateText);
    }

    function fallbackLocalReply(rawText) {
      const clean = rawText.replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').toLowerCase();
      if (/عيار\s*21|21k/.test(clean)) {
        return `عيار 21: شراء ${formatEGP(currentGoldData.k21.buy)} | بيع ${formatEGP(currentGoldData.k21.sell)}`;
      }
      if (/عيار\s*24|24k/.test(clean)) {
        return `عيار 24: شراء ${formatEGP(currentGoldData.k24.buy)} | بيع ${formatEGP(currentGoldData.k24.sell)}`;
      }
      if (/عيار\s*18|18k/.test(clean)) {
        return `عيار 18: شراء ${formatEGP(currentGoldData.k18.buy)} | بيع ${formatEGP(currentGoldData.k18.sell)}`;
      }
      if (/جنيه|الجنيه/.test(clean)) {
        return `الجنيه الذهب: شراء ${formatEGP(currentGoldData.pound.buy)} | بيع ${formatEGP(currentGoldData.pound.sell)}`;
      }
      if (/ذهب|دهب|سعر|اسعار|بكام/.test(clean)) {
        return (
          `عيار 24: شراء ${formatEGP(currentGoldData.k24.buy)} / بيع ${formatEGP(currentGoldData.k24.sell)}\n` +
          `عيار 21: شراء ${formatEGP(currentGoldData.k21.buy)} / بيع ${formatEGP(currentGoldData.k21.sell)}\n` +
          `عيار 18: شراء ${formatEGP(currentGoldData.k18.buy)} / بيع ${formatEGP(currentGoldData.k18.sell)}\n` +
          `الجنيه الذهب: شراء ${formatEGP(currentGoldData.pound.buy)} / بيع ${formatEGP(currentGoldData.pound.sell)}`
        );
      }
      return 'لتفعيل الإجابات المفتوحة على أي سؤال، ضع مفتاح GEMINI_API_KEY في الكود وتأكد من وجود إنترنت.';
    }

    function appendBotBubble(htmlContent) {
      const stream = document.getElementById('chat-stream');
      const div = document.createElement('div');
      div.className = 'msg bot-msg';
      div.innerHTML = htmlContent;
      stream.appendChild(div);
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      return div;
    }

    async function sendMessage() {
      if (isSending) return;
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if (!text) return;

      const stream = document.getElementById('chat-stream');
      const userDiv = document.createElement('div');
      userDiv.className = 'msg user-msg';
      userDiv.textContent = text;
      stream.appendChild(userDiv);
      input.value = '';

      conversationHistory.push({ role: 'user', text });

      const nameReply = handleUserNameCommands(text);
      if (nameReply) {
        conversationHistory.push({ role: 'model', text: nameReply.replace(/<[^>]+>/g, '') });
        appendBotBubble(nameReply);
        return;
      }

      if (!GEMINI_API_KEY) {
        const localAns = fallbackLocalReply(text);
        conversationHistory.push({ role: 'model', text: localAns });
        appendBotBubble(escapeHtml(localAns));
        return;
      }

      isSending = true;
      const thinkingBubble = appendBotBubble('جاري التفكير...');

      try {
        const answerHtml = await askGeminiOpen(text);
        thinkingBubble.innerHTML = answerHtml;
        conversationHistory.push({ role: 'model', text: thinkingBubble.textContent || '' });
      } catch (err) {
        const fallbackText = fallbackLocalReply(text);
        thinkingBubble.textContent = fallbackText;
        conversationHistory.push({ role: 'model', text: fallbackText });
      } finally {
        isSending = false;
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      }
    }

    applySavedWelcomeName();
    loadGoldPrices();
    setInterval(loadGoldPrices, 30000);
  </script>
</body>
</html>
