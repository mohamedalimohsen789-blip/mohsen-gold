<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سوق الذهبي & Mohsen AI</title>
  <style>
    * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; }
    body {
      margin: 0;
      background-color: #121212;
      color: #ffffff;
    }
    .top-bar {
      display: flex;
      background-color: #000000;
      border-bottom: 1px solid #262626;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .tab-btn {
      flex: 1;
      padding: 15px;
      background: transparent;
      color: #a0a0a0;
      border: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      border-bottom: 3px solid transparent;
    }
    .tab-btn.active {
      color: #00e676;
      border-bottom-color: #00e676;
      background-color: #181818;
    }
    .container { padding: 16px; max-width: 700px; margin: auto; }
    .page { display: none; }
    .page.active { display: block; }
    .card {
      background-color: #1c1c1c;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .karat { font-size: 17px; font-weight: bold; color: #ffd54f; }
    .prices { text-align: left; font-size: 14px; line-height: 1.7; direction: ltr; }
    .up { color: #00e676; font-weight: bold; }
    .chat-box {
      background-color: #181818;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      height: 62vh;
      overflow-y: auto;
      padding: 12px;
      margin-bottom: 10px;
    }
    .msg {
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 8px;
      max-width: 85%;
      line-height: 1.6;
      font-size: 14px;
    }
    .bot-msg { background-color: #242424; border-right: 3px solid #00e676; }
    .user-msg { background-color: #0d3b2e; margin-right: auto; text-align: right; }
    .input-row { display: flex; gap: 8px; }
    input[type="text"] {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #333;
      background-color: #1c1c1c;
      color: #fff;
      font-size: 14px;
    }
    .send-btn {
      padding: 12px 18px;
      border-radius: 10px;
      border: none;
      background-color: #00e676;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }
    .note { font-size: 12px; color: #9e9e9e; margin-bottom: 12px; }
  </style>
</head>
<body>

  <div class="top-bar">
    <button id="tab-gold" class="tab-btn active" onclick="switchTab('gold')">سوق الذهبي</button>
    <button id="tab-ai" class="tab-btn" onclick="switchTab('ai')">Mohsen AI</button>
  </div>

  <div class="container">
    <!-- صفحة سوق الذهبي -->
    <div id="page-gold" class="page active">
      <div id="gold-note" class="note">Loading verified prices...</div>
      <div class="card">
        <div class="karat">عيار 24</div>
        <div class="prices">Buy: <span id="k24-buy" class="up">---</span><br>Sell: <span id="k24-sell">---</span></div>
      </div>
      <div class="card">
        <div class="karat">عيار 21</div>
        <div class="prices">Buy: <span id="k21-buy" class="up">---</span><br>Sell: <span id="k21-sell">---</span></div>
      </div>
      <div class="card">
        <div class="karat">عيار 18</div>
        <div class="prices">Buy: <span id="k18-buy" class="up">---</span><br>Sell: <span id="k18-sell">---</span></div>
      </div>
      <div class="card">
        <div class="karat">الجنيه الذهب</div>
        <div class="prices">Buy: <span id="pound-buy" class="up">---</span><br>Sell: <span id="pound-sell">---</span></div>
      </div>
    </div>

    <!-- صفحة Mohsen AI -->
    <div id="page-ai" class="page">
      <div class="note">Mohsen AI — كلام طبيعي ومباشر بدون تكلف.</div>
      <div id="chat-box" class="chat-box">
        <div class="msg bot-msg">أهلاً بيك في <b>Mohsen AI</b>. إحكي معايا عادي أو اسألني عن أي حاجة.</div>
      </div>
      <div class="input-row">
        <input id="user-input" type="text" placeholder="اكتب أي حاجة في بالك..." onkeydown="if(event.key==='Enter') sendMessage()" />
        <button class="send-btn" onclick="sendMessage()">إرسال</button>
      </div>
    </div>
  </div>

  <script>
    const VERIFIED_GOLD_DATA = {
      sourceLabel: 'iSagha / Market Feed (Nov 19, 2026)',
      k24: { buy: 6525.75, sell: 6582.75 },
      k21: { buy: 5710, sell: 5760 },
      k18: { buy: 4894.25, sell: 4937.25 },
      pound: { buy: 45680, sell: 46080 }
    };

    let currentGoldData = { ...VERIFIED_GOLD_DATA };
    const CUSTOM_API_URL = '';

    function switchTab(tab) {
      document.getElementById('page-gold').classList.toggle('active', tab === 'gold');
      document.getElementById('page-ai').classList.toggle('active', tab === 'ai');
      document.getElementById('tab-gold').classList.toggle('active', tab === 'gold');
      document.getElementById('tab-ai').classList.toggle('active', tab === 'ai');
    }

    function formatEGP(num) {
      return Number(num).toLocaleString('en-US', {
        minimumFractionDigits: Number(num) % 1 === 0 ? 0 : 2,
        maximumFractionDigits: 2
      }) + ' EGP';
    }

    async function loadGoldPrices() {
      const noteEl = document.getElementById('gold-note');

      if (CUSTOM_API_URL) {
        try {
          const res = await fetch(CUSTOM_API_URL, { cache: 'no-store' });
          if (!res.ok) throw new Error('API response error');
          const apiData = await res.json();
          if (apiData?.k24 && apiData?.k21 && apiData?.k18 && apiData?.pound) {
            currentGoldData = {
              sourceLabel: apiData.sourceLabel || 'Live API Feed',
              k24: apiData.k24,
              k21: apiData.k21,
              k18: apiData.k18,
              pound: apiData.pound
            };
          }
        } catch (err) {
          console.warn('Using verified fallback gold data:', err);
        }
      }

      document.getElementById('k24-buy').textContent = formatEGP(currentGoldData.k24.buy);
      document.getElementById('k24-sell').textContent = formatEGP(currentGoldData.k24.sell);

      document.getElementById('k21-buy').textContent = formatEGP(currentGoldData.k21.buy);
      document.getElementById('k21-sell').textContent = formatEGP(currentGoldData.k21.sell);

      document.getElementById('k18-buy').textContent = formatEGP(currentGoldData.k18.buy);
      document.getElementById('k18-sell').textContent = formatEGP(currentGoldData.k18.sell);

      document.getElementById('pound-buy').textContent = formatEGP(currentGoldData.pound.buy);
      document.getElementById('pound-sell').textContent = formatEGP(currentGoldData.pound.sell);

      if (noteEl) {
        const checkedAt = new Date().toLocaleTimeString('en-US', { hour12: true });
        noteEl.textContent = `Source: ${currentGoldData.sourceLabel} | Checked every 30s | Last check: ${checkedAt}`;
      }
    }

    function normalizeArabic(str) {
      return str
        .toLowerCase()
        .replace(/[أإآ]/g, 'ا')
        .replace(/ة/g, 'ه')
        .replace(/ى/g, 'ي')
        .replace(/[ًٌٍَُِّ~ْ.,!?؟،؛:()\-_"'/\\]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function pickReply(options, seedText) {
      let sum = 0;
      for (let i = 0; i < seedText.length; i++) {
        sum += seedText.charCodeAt(i);
      }
      return options[sum % options.length];
    }

    function generateSmartReply(rawText) {
      const clean = normalizeArabic(rawText);

      // 1. التحيات والكلام العادي
      if (/^(هلا|اهلا|مرحبا|سلام|السلام عليكم|صباح الخير|مساء الخير|هاي|hi|hello|hey|ازيك|ازيكم|عامل ايه|اخبارك|ايه الاخبار|منور|منورين|يا هلا|اهلين)/.test(clean)) {
        return pickReply([
          'هلا بيك يا بطل، منور! عامل إيه النهارده؟',
          'أهلاً بيك، الدنيا تمام الحمد لله. قولي إيه الجديد عندك؟',
          'يا أهلاً، منور الدنيا. تحب نبدأ كلامنا بإيه؟'
        ], clean);
      }

      if (/^(شكرا|متشكر|تسلم|الله يباركلك|تمام|حلو|عاش|ماشي|اوك|ok|okay|جميل|ممتاز|ربنا يخليك)/.test(clean)) {
        return pickReply([
          'تسلم يا صاحبي، على الرحب والسعة.',
          'حبيبي يا بطل، لو احتجت أي حاجة أنا معاك.',
          'مفيش شكر بينا، قولي لو في حاجة تانية في بالك.'
        ], clean);
      }

      if (/مين انت|اسمك ايه|بتعمل ايه|انت مين/.test(clean)) {
        return 'أنا <b>Mohsen AI</b>، مساعدك جوه التطبيق؛ برد على كلامك بشكل طبيعي وبجاوبك على أسئلة السوق والذهب.';
      }

      // 2. أسئلة الصعود والهبوط والتوقعات (لا تعرض جدول الأسعار إلا لو طُلب)
      if (/هيصعد|هينزل|يصعد|ينزل|طالع|نازل|يرتفع|ينخفض|توقعات|اتجاه|مستقبل الذهب|مشتري دلوقتي|ابيع دلوقتي/.test(clean)) {
        return pickReply([
          'مفيش حد يقدر يضمن الذهب هيصعد ولا هينزل في لحظة معينة، لكن حركته بتعتمد أساساً على العرض والطلب في السوق، وسعر الصرف، وقرارات الفائدة والأخبار الاقتصادية. لو ناوي تشتري للادخار الطويل فالمقارنة بتكون بالمدى الزمني مش بحركة يوم واحد.',
          'السوق بطبيعته متقلب؛ صعود الذهب وهبوطه بيرتبط بتحركات الطلب الفعلي، وسعر الصرف، وتوجهات الفائدة والتضخم. الأفضل دايماً تقسيم الشراء وعدم الاعتماد على قرار لحظي واحد.'
        ], clean);
      }

      // 3. أسئلة محددة عن عيار أو الجنيه أو الأسعار
      if (/عيار 21|21/.test(clean)) {
        return `عيار 21 الآن: Buy <b>${formatEGP(currentGoldData.k21.buy)}</b> | Sell <b>${formatEGP(currentGoldData.k21.sell)}</b> (${currentGoldData.sourceLabel}).`;
      }
      if (/عيار 24|24/.test(clean)) {
        return `عيار 24 الآن: Buy <b>${formatEGP(currentGoldData.k24.buy)}</b> | Sell <b>${formatEGP(currentGoldData.k24.sell)}</b> (${currentGoldData.sourceLabel}).`;
      }
      if (/عيار 18|18/.test(clean)) {
        return `عيار 18 الآن: Buy <b>${formatEGP(currentGoldData.k18.buy)}</b> | Sell <b>${formatEGP(currentGoldData.k18.sell)}</b> (${currentGoldData.sourceLabel}).`;
      }
      if (/جنيه ذهب|الجنيه|جنيه/.test(clean)) {
        return `الجنيه الذهب (8g 21K) الآن: Buy <b>${formatEGP(currentGoldData.pound.buy)}</b> | Sell <b>${formatEGP(currentGoldData.pound.sell)}</b> (${currentGoldData.sourceLabel}).`;
      }
      if (/سعر الذهب|اسعار الذهب|الذهب بكام|الدهب بكام|اسعار|سعر/.test(clean)) {
        return `الأسعار الحالية المعلنة:<br>` +
               `• <b>عيار 24:</b> Buy ${formatEGP(currentGoldData.k24.buy)} | Sell ${formatEGP(currentGoldData.k24.sell)}<br>` +
               `• <b>عيار 21:</b> Buy ${formatEGP(currentGoldData.k21.buy)} | Sell ${formatEGP(currentGoldData.k21.sell)}<br>` +
               `• <b>عيار 18:</b> Buy ${formatEGP(currentGoldData.k18.buy)} | Sell ${formatEGP(currentGoldData.k18.sell)}<br>` +
               `• <b>الجنيه الذهب:</b> Buy ${formatEGP(currentGoldData.pound.buy)} | Sell ${formatEGP(currentGoldData.pound.sell)}`;
      }

      // 4. مفاهيم اقتصادية مباشرة
      if (/تضخم/.test(clean)) {
        return 'التضخم هو زيادة مستمرة في الأسعار وتراجع قوة الشراء للعملة، وده السبب اللي بيخلي ناس كتير تعتبر الذهب وسيلة لحفظ القيمة مع الوقت.';
      }
      if (/فايده|فائده|البنك المركزي/.test(clean)) {
        return 'الفائدة لما بتزيد بتشجع البعض على الادخار البنكي، ولما بتقل بيقل عائد الكاش وبيزيد الاهتمام بأصول زي الذهب.';
      }
      if (/مصنعيه|السبايك|سبايك|سبيكه/.test(clean)) {
        return 'السبائك والجنيهات مصنعيتها أقل وفيها استرداد لجزء من المصنعية أو كاش باك حسب القواعد المنظمة، عكس المشغولات اللي بتكون مصنعيتها أعلى.';
      }

      // 5. دردشة طبيعية ومباشرة لأي كلام عام آخر
      return pickReply([
        'كلامك منطقي، تحب نكمل في الموضوع ده ولا نغير الدفة لحاجة تانية؟',
        'حصل، وده بيفرق من شخص للتاني حسب ظروفه وأولوياته. قولي إيه اللي شاغلك أكتر دلوقتي؟',
        'مظبوط، أنا متابع معاك. احكيلي أكتر أو اسألني عن أي حاجة تحبها.'
      ], clean || rawText);
    }

    function sendMessage() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if (!text) return;

      const chatBox = document.getElementById('chat-box');
      chatBox.innerHTML += `<div class="msg user-msg">${text}</div>`;
      input.value = '';

      const reply = generateSmartReply(text);
      chatBox.innerHTML += `<div class="msg bot-msg">${reply}</div>`;
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    loadGoldPrices();
    setInterval(loadGoldPrices, 30000);
  </script>
</body>
</html>
