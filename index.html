<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#000000" />
  <title>سوق الذهبي & Mohsen AI</title>
  <style>
    * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; }
    html, body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #ffffff;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .top-bar {
      display: flex;
      background-color: #000000;
      border-bottom: 1px solid #262626;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .tab-btn {
      flex: 1;
      padding: 15px;
      background: transparent;
      color: #a0a0a0;
      border: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      border-bottom: 3px solid transparent;
    }
    .tab-btn.active {
      color: #00e676;
      border-bottom-color: #00e676;
      background-color: #181818;
    }
    .container {
      padding: 14px;
      max-width: 720px;
      margin: auto;
    }
    .page { display: none; }
    .page.active { display: block; }
    .notif-banner {
      display: none;
      background-color: #102a21;
      border: 1px solid #00e676;
      color: #d8ffeb;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 13px;
      line-height: 1.6;
    }
    .notif-banner.show { display: block; }
    .card {
      background-color: #1c1c1c;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .karat { font-size: 17px; font-weight: bold; color: #ffd54f; }
    .prices { text-align: left; font-size: 14px; line-height: 1.7; direction: ltr; }
    .up { color: #00e676; font-weight: bold; }
    .down { color: #ff5252; font-weight: bold; }

    #page-ai.active {
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 78px);
    }
    .chat-stream {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding-bottom: 84px;
    }
    .msg {
      padding: 11px 14px;
      border-radius: 12px;
      margin-bottom: 10px;
      max-width: 88%;
      line-height: 1.7;
      font-size: 14px;
      word-wrap: break-word;
      white-space: pre-line;
    }
    .bot-msg {
      background-color: #202020;
      border-right: 3px solid #00e676;
      align-self: flex-start;
    }
    .user-msg {
      background-color: #0d3b2e;
      align-self: flex-end;
      text-align: right;
    }
    .input-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: #121212;
      border-top: 1px solid #262626;
      padding: 10px 14px;
      z-index: 20;
    }
    .input-row {
      display: flex;
      gap: 8px;
      max-width: 720px;
      margin: auto;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #333;
      background-color: #1c1c1c;
      color: #fff;
      font-size: 14px;
    }
    .send-btn {
      padding: 12px 18px;
      border-radius: 10px;
      border: none;
      background-color: #00e676;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }
    .note { font-size: 12px; color: #9e9e9e; margin-bottom: 12px; }
  </style>
</head>
<body>

  <div class="top-bar">
    <button id="tab-gold" class="tab-btn active" onclick="switchTab('gold')">سوق الذهبي</button>
    <button id="tab-ai" class="tab-btn" onclick="switchTab('ai')">Mohsen AI</button>
  </div>

  <div class="container">
    <!-- صفحة سوق الذهبي -->
    <div id="page-gold" class="page active">
      <div id="gold-notif" class="notif-banner"></div>
      <div id="gold-note" class="note">Auto-checking every 30s...</div>
      <div class="card">
        <div class="karat">عيار 24</div>
        <div class="prices">Buy: <span id="k24-buy" class="up">---</span><br>Sell: <span id="k24-sell">---</span></div>
      </div>
      <div class="card">
        <div class="karat">عيار 21</div>
        <div class="prices">Buy: <span id="k21-buy" class="up">---</span><br>Sell: <span id="k21-sell">---</span></div>
      </div>
      <div class="card">
        <div class="karat">عيار 18</div>
        <div class="prices">Buy: <span id="k18-buy" class="up">---</span><br>Sell: <span id="k18-sell">---</span></div>
      </div>
      <div class="card">
        <div class="karat">الجنيه الذهب</div>
        <div class="prices">Buy: <span id="pound-buy" class="up">---</span><br>Sell: <span id="pound-sell">---</span></div>
      </div>
    </div>

    <!-- صفحة Mohsen AI -->
    <div id="page-ai" class="page">
      <div id="chat-stream" class="chat-stream">
        <div id="welcome-msg" class="msg bot-msg">أهلاً بيك في Mohsen AI. اسألني في أي حاجة عن الذهب والبورصة أو غيرهم.</div>
      </div>
      <div class="input-bar">
        <div class="input-row">
          <input id="user-input" type="text" placeholder="اكتب رسالتك هنا..." onkeydown="if(event.key==='Enter') sendMessage()" />
          <button class="send-btn" onclick="sendMessage()">إرسال</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const VERIFIED_GOLD_DATA = {
      sourceLabel: 'Market Feed (30s Auto-Check)',
      k24: { buy: 6525.75, sell: 6582.75 },
      k21: { buy: 5710, sell: 5760 },
      k18: { buy: 4894.25, sell: 4937.25 },
      pound: { buy: 45680, sell: 46080 }
    };

    const GEMINI_API_KEY = '';
    const GEMINI_MODEL = 'gemini-2.5-flash';

    const CUSTOM_API_URL = '';
    const PRICE_STORAGE_KEY = 'gold_last_snapshot_v11';
    const MOVE_STORAGE_KEY = 'gold_last_move_v11';
    const MEMORY_STORAGE_KEY = 'mohsen_ai_memory_v11';

    const STOP_WORDS = new Set([
      'في', 'من', 'على', 'الى', 'إلى', 'عن', 'مع', 'ده', 'دي', 'دا', 'هو', 'هي',
      'انا', 'أنا', 'انت', 'إنت', 'ليه', 'ايه', 'إيه', 'هيا', 'هي', 'ازاي', 'إزاي',
      'هل', 'ما', 'مش', 'لو', 'كان', 'يكون', 'كده', 'كذا', 'بس', 'يعني', 'اللي',
      'و', 'او', 'أو', 'قولي', 'قلي', 'ولا', 'لا'
    ]);

    const KNOWN_VOCABULARY = [
      'عيار', 'جنيه', 'ذهب', 'دهب', 'ذهي', 'سعر', 'اسعار', 'بكام', 'شراء', 'بيع',
      'بورصه', 'بورصة', 'اسهم', 'سهم', 'مؤشر', 'تداول', 'سيوله', 'تضخم', 'فايده',
      'مصنعيه', 'اوقيه', 'اونصه', 'اهلا', 'مرحبا', 'سلام', 'ازيك', 'اخبارك', 'منور',
      'اسمي', 'انسى', 'امسح', 'هتزيد', 'تزيد', 'هتنزل', 'تنزل', 'تقل', 'يقل', 'اخر',
      'مره', 'مرا', 'رايك', 'رأيك', 'غالي', 'رخيص', 'حلوه', 'مناسب'
    ];

    const GREETING_WORDS = new Set([
      'اهلا', 'مرحبا', 'سلام', 'هاي', 'هلا', 'ازيك', 'اخبارك', 'منور', 'صباح', 'مساء', 'عامل'
    ]);

    let currentGoldData = cloneGoldData(VERIFIED_GOLD_DATA);
    let lastRecordedMove = loadLastMove();
    let hasInitialBaseline = false;
    let conversationHistory = [];
    let repeatCounters = {};
    let isSending = false;
    let memoryStore = loadMemoryStore();

    function cloneGoldData(data) {
      return {
        sourceLabel: data.sourceLabel || 'Market Feed',
        k24: { buy: Number(data.k24.buy), sell: Number(data.k24.sell) },
        k21: { buy: Number(data.k21.buy), sell: Number(data.k21.sell) },
        k18: { buy: Number(data.k18.buy), sell: Number(data.k18.sell) },
        pound: { buy: Number(data.pound.buy), sell: Number(data.pound.sell) }
      };
    }

    function loadLastMove() {
      try {
        const raw = localStorage.getItem(MOVE_STORAGE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (parsed && (parsed.direction === 'up' || parsed.direction === 'down')) {
          return parsed;
        }
      } catch (e) {}
      return null;
    }

    function saveLastMove(direction, summary) {
      const payload = {
        direction,
        summary,
        time: new Date().toLocaleTimeString('en-US', { hour12: true })
      };
      lastRecordedMove = payload;
      try {
        localStorage.setItem(MOVE_STORAGE_KEY, JSON.stringify(payload));
      } catch (e) {}
    }

    function loadMemoryStore() {
      try {
        const raw = localStorage.getItem(MEMORY_STORAGE_KEY);
        if (!raw) return { pairs: [], userProfile: { name: '' } };
        const parsed = JSON.parse(raw);
        return {
          pairs: Array.isArray(parsed.pairs) ? parsed.pairs : [],
          userProfile: parsed.userProfile && typeof parsed.userProfile === 'object'
            ? { name: typeof parsed.userProfile.name === 'string' ? parsed.userProfile.name : '' }
            : { name: '' }
        };
      } catch (e) {
        return { pairs: [], userProfile: { name: '' } };
      }
    }

    function saveMemoryStore() {
      try {
        localStorage.setItem(MEMORY_STORAGE_KEY, JSON.stringify(memoryStore));
      } catch (e) {}
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function applySavedWelcomeName() {
      const welcomeEl = document.getElementById('welcome-msg');
      if (welcomeEl && memoryStore.userProfile && memoryStore.userProfile.name) {
        welcomeEl.innerHTML = `أهلاً بيك يا <b>${escapeHtml(memoryStore.userProfile.name)}</b> في Mohsen AI.`;
      }
    }

    function readSavedGoldData() {
      try {
        const raw = localStorage.getItem(PRICE_STORAGE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (isValidGoldData(parsed)) return cloneGoldData(parsed);
      } catch (e) {}
      return null;
    }

    function saveGoldData(data) {
      try {
        localStorage.setItem(PRICE_STORAGE_KEY, JSON.stringify(data));
      } catch (e) {}
    }

    function isValidGoldData(data) {
      const keys = ['k24', 'k21', 'k18', 'pound'];
      if (!data || typeof data !== 'object') return false;
      return keys.every((k) => {
        const item = data[k];
        return (
          item &&
          typeof item.buy === 'number' &&
          Number.isFinite(item.buy) &&
          item.buy > 0 &&
          typeof item.sell === 'number' &&
          Number.isFinite(item.sell) &&
          item.sell > 0
        );
      });
    }

    function detectPriceChanges(oldData, newData) {
      const labels = { k24: '24K', k21: '21K', k18: '18K', pound: 'Gold Pound' };
      const changes = [];
      let upCount = 0;
      let downCount = 0;

      ['k24', 'k21', 'k18', 'pound'].forEach((key) => {
        if (oldData[key].buy !== newData[key].buy) {
          if (newData[key].buy > oldData[key].buy) upCount++;
          else downCount++;
          changes.push(`${labels[key]} Buy: ${formatEGP(oldData[key].buy)} -> ${formatEGP(newData[key].buy)}`);
        }
        if (oldData[key].sell !== newData[key].sell) {
          if (newData[key].sell > oldData[key].sell) upCount++;
          else downCount++;
          changes.push(`${labels[key]} Sell: ${formatEGP(oldData[key].sell)} -> ${formatEGP(newData[key].sell)}`);
        }
      });

      if (changes.length > 0) {
        const direction = upCount >= downCount ? 'up' : 'down';
        saveLastMove(direction, changes[0]);
      }
      return changes;
    }

    async function triggerPriceNotification(changesText) {
      const banner = document.getElementById('gold-notif');
      if (banner) {
        banner.innerHTML = `<b>تم رصد تغير في الأسعار:</b><br>${changesText}`;
        banner.classList.add('show');
      }

      if ('Notification' in window) {
        try {
          if (Notification.permission === 'default') {
            await Notification.requestPermission();
          }
          if (Notification.permission === 'granted') {
            new Notification('سوق الذهبي — تحديث أسعار', {
              body: changesText.replace(/<br>/g, ' | ')
            });
          }
        } catch (e) {}
      }
    }

    function switchTab(tab) {
      document.getElementById('page-gold').classList.toggle('active', tab === 'gold');
      document.getElementById('page-ai').classList.toggle('active', tab === 'ai');
      document.getElementById('tab-gold').classList.toggle('active', tab === 'gold');
      document.getElementById('tab-ai').classList.toggle('active', tab === 'ai');
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    function formatEGP(num) {
      return Number(num).toLocaleString('en-US', {
        minimumFractionDigits: Number(num) % 1 === 0 ? 0 : 2,
        maximumFractionDigits: 2
      }) + ' EGP';
    }

    function applyDirectionClass(elId, oldVal, newVal, defaultClass) {
      const el = document.getElementById(elId);
      if (!el) return;
      el.classList.remove('up', 'down');
      if (newVal > oldVal) el.classList.add('up');
      else if (newVal < oldVal) el.classList.add('down');
      else if (defaultClass) el.classList.add(defaultClass);
    }

    async function loadGoldPrices() {
      const noteEl = document.getElementById('gold-note');
      const previousSnapshot = cloneGoldData(currentGoldData);
      let nextData = cloneGoldData(VERIFIED_GOLD_DATA);

      if (CUSTOM_API_URL) {
        try {
          const res = await fetch(CUSTOM_API_URL, { cache: 'no-store' });
          if (res.ok) {
            const apiData = await res.json();
            if (isValidGoldData(apiData)) {
              nextData = {
                sourceLabel: apiData.sourceLabel || 'Live API Feed',
                k24: { buy: Number(apiData.k24.buy), sell: Number(apiData.k24.sell) },
                k21: { buy: Number(apiData.k21.buy), sell: Number(apiData.k21.sell) },
                k18: { buy: Number(apiData.k18.buy), sell: Number(apiData.k18.sell) },
                pound: { buy: Number(apiData.pound.buy), sell: Number(apiData.pound.sell) }
              };
            }
          }
        } catch (err) {
          nextData = cloneGoldData(VERIFIED_GOLD_DATA);
        }
      }

      if (hasInitialBaseline) {
        const changes = detectPriceChanges(previousSnapshot, nextData);
        if (changes.length > 0) await triggerPriceNotification(changes.join('<br>'));
      } else {
        const saved = readSavedGoldData();
        if (saved && JSON.stringify(saved) !== JSON.stringify(nextData)) {
          const changesFromSaved = detectPriceChanges(saved, nextData);
          if (changesFromSaved.length > 0) await triggerPriceNotification(changesFromSaved.join('<br>'));
        }
        hasInitialBaseline = true;
      }

      currentGoldData = cloneGoldData(nextData);
      saveGoldData(currentGoldData);

      document.getElementById('k24-buy').textContent = formatEGP(currentGoldData.k24.buy);
      document.getElementById('k24-sell').textContent = formatEGP(currentGoldData.k24.sell);
      document.getElementById('k21-buy').textContent = formatEGP(currentGoldData.k21.buy);
      document.getElementById('k21-sell').textContent = formatEGP(currentGoldData.k21.sell);
      document.getElementById('k18-buy').textContent = formatEGP(currentGoldData.k18.buy);
      document.getElementById('k18-sell').textContent = formatEGP(currentGoldData.k18.sell);
      document.getElementById('pound-buy').textContent = formatEGP(currentGoldData.pound.buy);
      document.getElementById('pound-sell').textContent = formatEGP(currentGoldData.pound.sell);

      applyDirectionClass('k24-buy', previousSnapshot.k24.buy, currentGoldData.k24.buy, 'up');
      applyDirectionClass('k21-buy', previousSnapshot.k21.buy, currentGoldData.k21.buy, 'up');
      applyDirectionClass('k18-buy', previousSnapshot.k18.buy, currentGoldData.k18.buy, 'up');
      applyDirectionClass('pound-buy', previousSnapshot.pound.buy, currentGoldData.pound.buy, 'up');

      if (noteEl) {
        const checkedAt = new Date().toLocaleTimeString('en-US', { hour12: true });
        noteEl.textContent = `${currentGoldData.sourceLabel} | Checked every 30s | Last check: ${checkedAt}`;
      }
    }

    function normalizeText(str) {
      return str
        .toLowerCase()
        .replace(/[أإآ]/g, 'ا')
        .replace(/ة/g, 'ه')
        .replace(/ى/g, 'ي')
        .replace(/[ًٌٍَُِّ~ْ.,!?؟،؛:()\-_"'/\\]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function levenshteinDistance(a, b) {
      const m = a.length;
      const n = b.length;
      if (m === 0) return n;
      if (n === 0) return m;
      const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
      for (let i = 0; i <= m; i++) dp[i][0] = i;
      for (let j = 0; j <= n; j++) dp[0][j] = j;
      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;
          dp[i][j] = Math.min(
            dp[i - 1][j] + 1,
            dp[i][j - 1] + 1,
            dp[i - 1][j - 1] + cost
          );
        }
      }
      return dp[m][n];
    }

    function guessClosestWord(word, candidates) {
      if (!word || word.length < 2 || /^\d+$/.test(word)) return word;
      let bestWord = word;
      let bestDist = Infinity;
      for (const cand of candidates) {
        if (!cand || Math.abs(cand.length - word.length) > 2) continue;
        const dist = levenshteinDistance(word, cand);
        const maxAllowed = cand.length <= 3 ? 1 : (cand.length <= 5 ? 1 : 2);
        if (dist > 0 && dist <= maxAllowed && dist < bestDist) {
          bestDist = dist;
          bestWord = cand;
        }
      }
      return bestWord;
    }

    function applyTypoCorrection(rawText) {
      const clean = normalizeText(rawText);
      const learnedWords = [];
      for (const pair of memoryStore.pairs || []) {
        const parts = normalizeText(pair.promptNorm || '').split(' ');
        for (const p of parts) {
          if (p.length >= 2 && !STOP_WORDS.has(p)) learnedWords.push(p);
        }
      }
      const candidates = Array.from(new Set([...KNOWN_VOCABULARY, ...learnedWords]));
      return clean.split(' ').map((w) => guessClosestWord(w, candidates)).join(' ').trim();
    }

    function extractKeywords(str) {
      return normalizeText(str)
        .split(' ')
        .filter((w) => w.length > 1 && !STOP_WORDS.has(w));
    }

    function learnAssociation(promptText, answerText, weightBoost = 1) {
      const cleanPrompt = normalizeText(promptText);
      const cleanAnswer = answerText.trim();
      const keywords = extractKeywords(promptText);
      if (!cleanPrompt || !cleanAnswer) return;

      const existing = memoryStore.pairs.find((p) => p.promptNorm === cleanPrompt);
      if (existing) {
        existing.answer = cleanAnswer;
        existing.keywords = Array.from(new Set([...existing.keywords, ...keywords]));
        existing.weight = (existing.weight || 1) + weightBoost;
      } else {
        memoryStore.pairs.push({
          promptRaw: promptText.trim(),
          promptNorm: cleanPrompt,
          keywords,
          answer: cleanAnswer,
          weight: weightBoost
        });
      }
      saveMemoryStore();
    }

    function findBestLearnedMatch(rawText) {
      const clean = normalizeText(rawText);
      const inputKeywords = extractKeywords(rawText);
      if (!memoryStore.pairs.length || (!clean && !inputKeywords.length)) return null;

      let best = null;
      let bestScore = 0;
      for (const pair of memoryStore.pairs) {
        let score = 0;
        if (clean === pair.promptNorm) score += 10;
        else if (clean.includes(pair.promptNorm) || pair.promptNorm.includes(clean)) score += 5;

        const pairKw = pair.keywords || [];
        if (pairKw.length && inputKeywords.length) {
          const matches = pairKw.filter((k) => inputKeywords.includes(k)).length;
          if (matches > 0) score += (matches / Math.max(pairKw.length, inputKeywords.length)) * 4;
        }
        score += (pair.weight || 1) * 0.25;
        if (score > bestScore) {
          bestScore = score;
          best = pair;
        }
      }
      return bestScore >= 2.2 ? best : null;
    }

    function pickVariant(variants, key) {
      const idx = repeatCounters[key] || 0;
      repeatCounters[key] = idx + 1;
      return variants[idx % variants.length];
    }

    // يلتقط طلبات أسعار الذهب المسجلة في التطبيق فقط دون التعدي على أسعار أي شيء آخر أو أسئلة التحليل والرأي
    function isDirectGoldPriceLookup(clean) {
      const asksOpinionOrAnalysis = /(?:رايك|رأيك|غالي|رخيص|حلوه|مناسب|مناسبه|هتزيد|تزيد|هتنزل|تنزل|تقل|يقل|اخر\s+مر[هةا]|آخر\s+مر[هةة]|بورص[هة]|اسهم|مؤشر|تضخم|فايد[هة]|تحليل|توقع|توقعات|علاقه|فرق)/.test(clean);
      if (asksOpinionOrAnalysis) return false;

      const mentionsOtherThing = /(?:دولار|ريال|درهم|يورو|فضه|فضة|نحاس|بترول|نفط|عقار|عربيه|موبايل|سهم\s+\S+)/.test(clean);
      if (mentionsOtherThing) return false;

      return /(?:ذهب|دهب|ذهي|عيار\s*(?:24|21|18)|24k|21k|18k|جنيه\s+ذهب|الجنيه)/.test(clean)
        && /(?:سعر|اسعار|بكام|كام)/.test(clean);
    }

    function getAppGoldPricesReply(clean, namePrefix) {
      if (/عيار\s*21|21k/.test(clean)) {
        return pickVariant([
          `${namePrefix}عيار 21 في التطبيق: شراء ${formatEGP(currentGoldData.k21.buy)} | بيع ${formatEGP(currentGoldData.k21.sell)}`,
          `${namePrefix}سعر عيار 21 الحالي في التطبيق شراء ${formatEGP(currentGoldData.k21.buy)} والبيع ${formatEGP(currentGoldData.k21.sell)}.`
        ], 'p21');
      }
      if (/عيار\s*24|24k/.test(clean)) {
        return pickVariant([
          `${namePrefix}عيار 24 في التطبيق: شراء ${formatEGP(currentGoldData.k24.buy)} | بيع ${formatEGP(currentGoldData.k24.sell)}`,
          `${namePrefix}سعر عيار 24 الحالي في التطبيق شراء ${formatEGP(currentGoldData.k24.buy)} والبيع ${formatEGP(currentGoldData.k24.sell)}.`
        ], 'p24');
      }
      if (/عيار\s*18|18k/.test(clean)) {
        return pickVariant([
          `${namePrefix}عيار 18 في التطبيق: شراء ${formatEGP(currentGoldData.k18.buy)} | بيع ${formatEGP(currentGoldData.k18.sell)}`,
          `${namePrefix}سعر عيار 18 الحالي في التطبيق شراء ${formatEGP(currentGoldData.k18.buy)} والبيع ${formatEGP(currentGoldData.k18.sell)}.`
        ], 'p18');
      }
      if (/جنيه|الجنيه/.test(clean)) {
        return pickVariant([
          `${namePrefix}الجنيه الذهب في التطبيق: شراء ${formatEGP(currentGoldData.pound.buy)} | بيع ${formatEGP(currentGoldData.pound.sell)}`,
          `${namePrefix}سعر الجنيه الذهب الحالي في التطبيق شراء ${formatEGP(currentGoldData.pound.buy)} والبيع ${formatEGP(currentGoldData.pound.sell)}.`
        ], 'ppound');
      }

      return pickVariant([
        `${namePrefix}الأسعار الحالية في التطبيق:\n` +
        `عيار 24: شراء ${formatEGP(currentGoldData.k24.buy)} | بيع ${formatEGP(currentGoldData.k24.sell)}\n` +
        `عيار 21: شراء ${formatEGP(currentGoldData.k21.buy)} | بيع ${formatEGP(currentGoldData.k21.sell)}\n` +
        `عيار 18: شراء ${formatEGP(currentGoldData.k18.buy)} | بيع ${formatEGP(currentGoldData.k18.sell)}\n` +
        `الجنيه الذهب: شراء ${formatEGP(currentGoldData.pound.buy)} | بيع ${formatEGP(currentGoldData.pound.sell)}`,
        `${namePrefix}أسعار الذهب في التطبيق حالياً بالـ EGP:\n` +
        `• عيار 24: شراء ${formatEGP(currentGoldData.k24.buy)} / بيع ${formatEGP(currentGoldData.k24.sell)}\n` +
        `• عيار 21: شراء ${formatEGP(currentGoldData.k21.buy)} / بيع ${formatEGP(currentGoldData.k21.sell)}\n` +
        `• عيار 18: شراء ${formatEGP(currentGoldData.k18.buy)} / بيع ${formatEGP(currentGoldData.k18.sell)}\n` +
        `• الجنيه الذهب: شراء ${formatEGP(currentGoldData.pound.buy)} / بيع ${formatEGP(currentGoldData.pound.sell)}`
      ], 'pall');
    }

    function thinkSilently(rawText) {
      const trimmed = rawText.trim();
      const corrected = applyTypoCorrection(trimmed);
      const norm = normalizeText(corrected);

      if (/^(انس[يى]\s+اسمي|امسح\s+اسمي|احذف\s+اسمي)$/.test(norm)) {
        memoryStore.userProfile.name = '';
        saveMemoryStore();
        return 'تم مسح اسمك.';
      }

      if (/^(اسمي\s*(ايه|إيه|ايش|شو)?|انا\s+مين|عارف\s+اسمي|تعرف\s+اسمي|فاكر\s+اسمي)\s*[؟?]*$/.test(norm)) {
        if (memoryStore.userProfile && memoryStore.userProfile.name) {
          return `اسمك ${escapeHtml(memoryStore.userProfile.name)}.`;
        }
        return 'لسه مقولتليش اسمك.';
      }

      const nameMatch = trimmed.match(/(?:^|\s)(?:اسمي(?:\s+(?:هو|هي|بقى|بقا))?|انا\s+اسمي|ناديني|قولي\s+يا)\s+([^\s،.!?؟]+(?:\s+[^\s،.!?؟]+){0,2})/i);
      if (nameMatch && nameMatch[1]) {
        const candidate = nameMatch[1].replace(/\s+(ايه|إيه|ليه|عشان|يا|ده|دي)$/i, '').trim();
        if (candidate && candidate.length >= 2 && candidate.length <= 40) {
          memoryStore.userProfile.name = candidate;
          saveMemoryStore();
          return `تمام، اسمك بقى محفوظ عندي: ${escapeHtml(candidate)}.`;
        }
      }

      const lastUserMsg = [...conversationHistory].reverse().find((m) => m.role === 'user');
      if (/^(لا|مش كده|غلط|صحح|المقصود|قصدي|معناه|بمعنى|يعني ان|خلي بالك|توضيح)/.test(norm) && lastUserMsg && lastUserMsg.text !== trimmed) {
        const cleanedClarification = trimmed.replace(/^(لا|مش كده|غلط|صحح|المقصود|قصدي|معناه|بمعنى|يعني)\s*/i, '').trim() || trimmed;
        learnAssociation(lastUserMsg.text, cleanedClarification, 2);
        return 'تمام، هعتمد التوضيح ده بعد كده.';
      }

      const namePrefix = memoryStore.userProfile && memoryStore.userProfile.name
        ? `${escapeHtml(memoryStore.userProfile.name)}، `
        : '';

      if (isDirectGoldPriceLookup(norm)) {
        return getAppGoldPricesReply(norm, namePrefix);
      }

      const learnedMatch = findBestLearnedMatch(corrected) || findBestLearnedMatch(trimmed);
      if (learnedMatch) {
        return escapeHtml(learnedMatch.answer);
      }

      return null;
    }

    function localDirectFallback(rawText) {
      const clean = normalizeText(applyTypoCorrection(rawText));
      const namePrefix = memoryStore.userProfile && memoryStore.userProfile.name
        ? `${escapeHtml(memoryStore.userProfile.name)}، `
        : '';

      const words = clean.split(' ').filter(Boolean);
      if (/^(اهلا|مرحبا|سلام|السلام عليكم|صباح الخير|مساء الخير|هاي|هلا|ازيك|اخبارك|منور|عامل ايه)$/.test(clean)
        || (words.length === 1 && GREETING_WORDS.has(words[0]))) {
        return pickVariant([
          `${namePrefix}أهلاً بيك. اسألني في أي حاجة عن الذهب والبورصة أو غيرهم.`,
          `${namePrefix}أهلاً، منور. تحب تسأل عن إيه؟`
        ], 'greet');
      }

      if (/(?:اخر\s+مر[هةا]|آخر\s+مر[هةة]).*(?:زاد|زادت|قل|قلت|نزل|نزلت)/.test(clean)
        || /(?:زاد|زادت|قل|قلت).*(?:اخر\s+مر[هةا]|آخر\s+مر[هةة])/.test(clean)) {
        if (lastRecordedMove) {
          const dirLabel = lastRecordedMove.direction === 'up' ? 'زاد' : 'قل';
          return `${namePrefix}آخر تغير رصده التطبيق كان إنه ${dirLabel} (${lastRecordedMove.summary} — ${lastRecordedMove.time}).`;
        }
        return `${namePrefix}السعر ثابت حالياً على أحدث قراءة في التطبيق ومفيش حركة صعود أو هبوط جديدة اتسجلت لحد دلوقتي.`;
      }

      if (/(?:رايك|رأيك|غالي|رخيص|حلوه|مناسب|مناسبه).*(?:ذهب|دهب|سعر|اسعار|بورص[هة]|اسهم)/.test(clean)
        || /(?:ذهب|دهب|سعر|اسعار|بورص[هة]|اسهم).*(?:رايك|رأيك|غالي|رخيص|حلوه|مناسب|مناسبه)/.test(clean)) {
        return pickVariant([
          `${namePrefix}رأيي إن كلمة "غالي أو رخيص" بتفرق حسب هدفك: لو بتشتري لادخار طويل أو تحوّط، فتقسيم المبلغ على دفعات واختيار مصنعية قليلة أهم من مطاردة قمة أو قاع؛ أما للمضاربة القصيرة ففرق الشراء والبيع والتذبذب بيكونوا حاسمين.`,
          `${namePrefix}من وجهة نظري، السعر في أي سوق بيحكمه هدفك ومدة احتفاظك: في الادخار الأفضل عدم الدخول بكامل السيولة مرة واحدة، وفي البورصة والذهب إدارة المخاطر أهم من توقع نقطة مثالية.`
        ], 'opinion_price');
      }

      if (/(?:هتزيد|تزيد|هتنزل|تنزل|تقل|يقل|توقعات|توقع|اتجاه|مستقبل)/.test(clean)) {
        return pickVariant([
          `${namePrefix}مفيش حد يقدر يجزم السعر هيزيد ولا هيقل بدقة؛ الحركة بتعتمد على سعر الأوقية عالمياً، وسعر الصرف، وحركة البورصة والسيولة، والفايدة والتضخم.`,
          `${namePrefix}صعود أو هبوط الذهب والبورصة مرتبط بعوامل كتير زي الفايدة العالمية، التضخم، السيولة، والعرض والطلب؛ فالأفضل تقرر حسب مدتك وهدفك وإدارة المخاطر.`
        ], 'trend');
      }

      if (/بورص[هة]|اسهم|سهم|مؤشر|تداول|سيول[هة]/.test(clean)) {
        return pickVariant([
          `${namePrefix}البورصة بتعكس توقعات المستثمرين وحركة السيولة والأرباح، وأحياناً بيحصل تبديل سيولة بين الأسهم والذهب حسب شهية المخاطرة والفايدة.`,
          `${namePrefix}في البورصة والذهب، إدارة المخاطر وتوزيع السيولة أهم من مطاردة حركة سريعة؛ كل أداة ليها طبيعة مختلفة في العائد والتذبذب.`
        ], 'market');
      }

      if (/سعر|اسعار|بكام/.test(clean)) {
        return `${namePrefix}الأسعار المتاحة في التطبيق حالياً هي لأسعار الذهب فقط؛ لو بتسأل عن سعر حاجة تانية أو معلومة عنها، فهجاوبك على حسب المعطيات المتاحة.`;
      }

      if (/تضخم/.test(clean)) {
        return `${namePrefix}التضخم معناه زيادة الأسعار وتراجع القوة الشرائية للعملة مع الوقت، وده بيخلي الذهب أداة شائعة لحفظ القيمة مقارنة بالكاش.`;
      }

      if (/فايد[هة]|مركزي/.test(clean)) {
        return `${namePrefix}سعر الفائدة بيأثر على تكلفة الاقتراض وجاذبية أدوات الدخل الثابت مقابل الأسهم والذهب بحسب توقعات السوق.`;
      }

      if (/مصنعيه|سبايك|سبيكه/.test(clean)) {
        return `${namePrefix}المشغولات الذهبية فيها مصنعية أعلى مقابل الصياغة، بينما السبائك والجنيهات مصنعيتها أقل وبتقرب أكتر من قيمة الذهب الخام.`;
      }

      return pickVariant([
        `${namePrefix}أنا معاك؛ اسألني في أي حاجة عن الذهب والبورصة أو أي موضوع مفتوح تحب تتكلم فيه.`,
        `${namePrefix}قولي سؤالك أو الفكرة اللي في بالك وهرد عليك مباشرة.`
      ], 'open_fallback');
    }

    async function askGeminiOpen(userText) {
      const savedName = memoryStore.userProfile && memoryStore.userProfile.name ? memoryStore.userProfile.name : '';
      const pricesSummary =
        `24K Buy ${formatEGP(currentGoldData.k24.buy)} / Sell ${formatEGP(currentGoldData.k24.sell)}, ` +
        `21K Buy ${formatEGP(currentGoldData.k21.buy)} / Sell ${formatEGP(currentGoldData.k21.sell)}, ` +
        `18K Buy ${formatEGP(currentGoldData.k18.buy)} / Sell ${formatEGP(currentGoldData.k18.sell)}, ` +
        `Gold Pound Buy ${formatEGP(currentGoldData.pound.buy)} / Sell ${formatEGP(currentGoldData.pound.sell)}.`;

      const systemInstruction =
        `أنت مساعد ذكي باسم Mohsen AI. فكر داخلياً وأرسل الإجابة النهائية المباشرة والواضحة فقط باللغة العربية المصرية دون مقدمات أو قوالب مثل "في موضوع...". ` +
        `جاوب على أي سؤال عن الذهب أو البورصة أو أسعار أي شيء أو الرأي والتحليل أو أي موضوع مفتوح آخر بشكل طبيعي ومباشر وغير مقيد بقوالب ثابتة. ` +
        `لا تذكر أسعار الذهب في التطبيق إلا إذا سأل المستخدم عن أسعار الذهب تحديداً. ` +
        `مرجع أسعار الذهب الحالية في التطبيق (لوقت سؤال الذهب فقط): ${pricesSummary} ` +
        (savedName ? `اسم المستخدم المحفوظ: "${savedName}".` : '');

      const contents = conversationHistory.slice(-10).map((item) => ({
        role: item.role === 'user' ? 'user' : 'model',
        parts: [{ text: item.text }]
      }));

      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(GEMINI_MODEL)}:generateContent?key=${encodeURIComponent(GEMINI_API_KEY)}`;

      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: systemInstruction }] },
          contents
        })
      });

      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      const data = await res.json();
      const candidateText = data?.candidates?.[0]?.content?.parts
        ?.map((p) => p.text || '')
        .join('')
        .trim();

      if (!candidateText) throw new Error('Empty response');
      return candidateText;
    }

    function sendFinalBotMessage(textOrHtml, isHtml = false) {
      const stream = document.getElementById('chat-stream');
      const div = document.createElement('div');
      div.className = 'msg bot-msg';
      if (isHtml) div.innerHTML = textOrHtml;
      else div.textContent = textOrHtml;
      stream.appendChild(div);
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    async function sendMessage() {
      if (isSending) return;
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if (!text) return;

      const stream = document.getElementById('chat-stream');
      const userDiv = document.createElement('div');
      userDiv.className = 'msg user-msg';
      userDiv.textContent = text;
      stream.appendChild(userDiv);
      input.value = '';

      conversationHistory.push({ role: 'user', text });

      const silentResult = thinkSilently(text);
      if (silentResult) {
        conversationHistory.push({ role: 'model', text: silentResult.replace(/<[^>]+>/g, '') });
        sendFinalBotMessage(silentResult, true);
        return;
      }

      if (!GEMINI_API_KEY) {
        const localAns = localDirectFallback(text);
        conversationHistory.push({ role: 'model', text: localAns.replace(/<br>/g, '\n') });
        sendFinalBotMessage(localAns, true);
        return;
      }

      isSending = true;
      try {
        const finalAnswer = await askGeminiOpen(text);
        conversationHistory.push({ role: 'model', text: finalAnswer });
        sendFinalBotMessage(finalAnswer, false);
      } catch (err) {
        const fallbackText = localDirectFallback(text);
        conversationHistory.push({ role: 'model', text: fallbackText.replace(/<br>/g, '\n') });
        sendFinalBotMessage(fallbackText, true);
      } finally {
        isSending = false;
      }
    }

    applySavedWelcomeName();
    loadGoldPrices();
    setInterval(loadGoldPrices, 30000);
  </script>
